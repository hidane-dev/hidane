name: Bug report
description: hidane crashes, hangs, or returns an error it should not.
labels: ["kind:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If the problem is that hidane **behaves differently** from the official
        Firestore emulator (different result, different error code, different ordering), please use the
        **Parity gap** template instead.

        Security issues must not be filed here; see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including the full error message if there is one.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, or a code snippet. The smaller, the faster we can fix it.
      placeholder: |
        1. Start hidane with `hidane --port 8080`
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: hidane-version
    attributes:
      label: hidane version
      description: Output of `hidane --version` (or the commit hash if built from source).
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: official-behavior
    attributes:
      label: Behaviour on the official emulator
      description: >-
        What happens when you run the same steps against the official Firestore emulator
        (`firebase emulators:start`)? Include the firebase-tools version. If you have not tried,
        say so.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS / architecture
      placeholder: "macOS 15 (arm64), Ubuntu 24.04 (x86_64), Windows 11 ..."
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from hidane. Will be rendered as code automatically.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this bug has not been reported yet.
          required: true
