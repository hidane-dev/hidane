version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      cargo-workspace: { patterns: ["*"] }
      cargo-workspace-security: { applies-to: security-updates, patterns: ["*"] }
  # The Rust that builds the release binaries (docs/reproducible-builds.md).
  - package-ecosystem: rust-toolchain
    directory: /packaging/release
    schedule: { interval: weekly }
  - package-ecosystem: pub
    directory: /packaging/pub
    schedule: { interval: weekly }
  # The workflows, and the composite actions they share (`/` covers .github/workflows only).
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: weekly }

  # The examples pin every dependency; .github/workflows/examples.yml runs each update against
  # hidane. The README's demo pins the same as examples/admin-node; demo.yml records it again.
  # Security updates are grouped too: one advisory otherwise opens a pull request per directory.
  - package-ecosystem: npm
    directories:
      - /examples/admin-node
      - /examples/functions
      - /examples/functions/functions
      - /examples/rules-unit-testing
      - /docs/assets/demo
    schedule: { interval: weekly }
    groups:
      examples-npm: { patterns: ["*"] }
      examples-npm-security: { applies-to: security-updates, patterns: ["*"] }
  - package-ecosystem: pip
    directory: /examples/admin-python
    schedule: { interval: weekly }
    groups:
      examples-pip: { patterns: ["*"] }
      examples-pip-security: { applies-to: security-updates, patterns: ["*"] }
  - package-ecosystem: gomod
    directory: /examples/go
    schedule: { interval: weekly }
    groups:
      examples-go: { patterns: ["*"] }
      examples-go-security: { applies-to: security-updates, patterns: ["*"] }
  # The workflow to copy (outside .github/workflows, so that it does not run here).
  - package-ecosystem: github-actions
    directory: /examples/github-actions
    schedule: { interval: weekly }

  # The SDK harnesses under tools/oracle pin every dependency (go.sum, the pip freeze, pom.xml) at
  # the versions their transcripts were recorded with (tools/oracle/README.md), so moving one is a
  # re-recording, not a routine bump. Version updates are off for them (open-pull-requests-limit:
  # 0); security updates still open pull requests.
  - package-ecosystem: gomod
    directory: /tools/oracle/sdk_go
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /tools/oracle/sdk_python
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: maven
    directory: /tools/oracle/sdk_java
    schedule: { interval: weekly }
    open-pull-requests-limit: 0

  # packaging/docker/Dockerfile builds `FROM scratch`, with no base image to update.
