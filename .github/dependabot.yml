version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      cargo-workspace: { patterns: ["*"] }
  # The Rust that builds the release binaries (docs/reproducible-builds.md).
  - package-ecosystem: rust-toolchain
    directory: /packaging/release
    schedule: { interval: weekly }
  - package-ecosystem: pub
    directory: /packaging/pub
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  # The examples pin every dependency; .github/workflows/examples.yml runs each update against
  # hidane.
  - package-ecosystem: npm
    directories: ["/examples/admin-node"]
    schedule: { interval: weekly }
    groups:
      examples-npm: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /examples/admin-python
    schedule: { interval: weekly }
    groups:
      examples-pip: { patterns: ["*"] }
  - package-ecosystem: gomod
    directory: /examples/go
    schedule: { interval: weekly }
    groups:
      examples-go: { patterns: ["*"] }
