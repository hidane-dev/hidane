name: Android SDK

# Runs the Android SDK harness (tools/oracle/sdk_android/: firebase-android-sdk's
# firebase-firestore in an instrumentation test) in an Android emulator against hidane, one
# section at a time, and compares each transcript with the committed
# results/sdk-android-<section>-hidane.json (tools/oracle/sdk_android/ci.sh). The official
# emulator's transcripts were recorded by hand (tools/oracle/README.md); tools/parity/table.py
# compares the committed pairs.
#
# It runs monthly, by hand, and for changes to the harness or its results (the listen section
# waits 95 seconds). It needs no secret and gets none.

on:
  schedule:
    - cron: "47 4 3 * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/oracle/sdk_android/**"
      - "results/sdk-android-*.json"
      - ".github/workflows/android-sdk.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: firebase-firestore in an Android emulator against hidane
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build hidane
        run: cargo build --release --locked -p hidane
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          overwrite-settings: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.1"
          cache-disabled: true
      - name: Build the harness
        working-directory: tools/oracle/sdk_android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      # The emulator needs KVM on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run each section against a fresh hidane and compare
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: tools/oracle/sdk_android/ci.sh target/release/hidane "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sdk-android-hidane
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore
