name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # docs/parity.md, hidane.dev's Parity section and its badge follow the fixtures; the tests
      # below replaying every fixture is what makes the counts matching answers.
      - run: python3 tools/parity/table.py --check
      # docs/oracle-corpus.json lists the same recordings with their provenance (needs no history:
      # its git-derived fields are kept while a recording is unchanged).
      - run: python3 tools/oracle/corpus.py --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # What crates.io would receive builds on its own (sources, protos, licenses). Packaging
      # crates that depend on each other before they are published needs cargo 1.90 or newer.
      - run: cargo package --workspace --locked

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rust-version in Cargo.toml says 1.88; keep it true.
      - run: cargo check --workspace --all-targets --locked

  packaging:
    name: packaging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cargo.toml, its pins and the pub launcher carry the same version.
      - run: node packaging/check-versions.mjs
      - run: node --check packaging/npm/hidane/bin/hidane.js
      - run: node packaging/npm/assemble.mjs --placeholders 0.0.0 "$RUNNER_TEMP/npm"

  licenses:
    name: third-party licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # A dependency under a license about.toml does not accept fails here, not at release.
      - run: cargo install cargo-about --locked --features cli --version 0.9.2
      - run: cargo about generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.txt

  cla:
    name: cla check script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script behind the required `cla` status runs from main, so its changes are tested
      # here, against a fake gh (.github/cla/test.sh), before they reach main.
      - run: shellcheck .github/cla/check.sh .github/cla/test.sh
      - run: bash .github/cla/test.sh
