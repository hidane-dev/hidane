name: Demo

# Records the README's demos on a GitHub-hosted runner, one GIF per tape in docs/assets/demo:
# demo.tape, 200 firebase-admin tests through `hidane exec` in a shell without Java;
# demo-startup.tape, how long the official emulator and hidane's latest release each take to open
# their port; demo-writes.tape, 100,000 documents written to each. It uploads the GIFs as an
# artifact, which a maintainer copies to docs/assets/; nothing is pushed or published. Each command
# runs once before the recording, so the jar is downloaded and both start from the same warm caches.

on:
  pull_request:
    paths:
      - "docs/assets/demo/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: record the demo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VHS_VERSION: 0.12.1
      VHS_SHA256: eb33787a5b1cebf91fe0b18bd231e2d71d36c1ff4babd99ddac1a6ab411efd10
      TTYD_VERSION: 1.7.7
      TTYD_SHA256: 8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55
      # Chrome's sandbox needs user namespaces, which Ubuntu 24.04's AppArmor restricts.
      VHS_NO_SANDBOX: "true"
    defaults:
      run:
        working-directory: docs/assets/demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/assets/demo/package-lock.json
      - uses: hidane-dev/setup-hidane@97f59bf4893a4ee993fc1ee5ff235258ece75eb0 # v1.1.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: VHS, ttyd, ffmpeg and the font
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-jetbrains-mono > /dev/null
          curl -fsSLo vhs.tar.gz "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          echo "$VHS_SHA256  vhs.tar.gz" | sha256sum --check --strict
          curl -fsSLo ttyd "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          echo "$TTYD_SHA256  ttyd" | sha256sum --check --strict
          mkdir -p tools
          tar -xzf vhs.tar.gz -C tools --strip-components=1 "vhs_${VHS_VERSION}_Linux_x86_64/vhs"
          install -m 0755 ttyd tools/ttyd
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      # The runner image's own Java goes, so that setup-java's, first on PATH, is the only one:
      # demo.tape takes it off PATH for a shell without Java.
      - name: Only setup-java's Java
        run: |
          sudo update-alternatives --remove-all java
          [ "$(command -v java)" = "$JAVA_HOME/bin/java" ]
      - name: Each command once, before the recording
        run: |
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$PWD/node_modules/.bin:$PATH"
          firebase emulators:exec "npm test" > /dev/null 2>&1
          ./ready java -jar ~/.cache/firebase/emulators/cloud-firestore-emulator-*.jar --host 127.0.0.1 --port 8080
          ./ready hidane --host 127.0.0.1 --port 8080
          ./write java -jar ~/.cache/firebase/emulators/cloud-firestore-emulator-*.jar --host 127.0.0.1 --port 8080
          ./write hidane --host 127.0.0.1 --port 8080
          (
            PATH="$(printf %s "$PATH" | tr : '\n' | grep -vxF "$JAVA_HOME/bin" | paste -sd: -)"
            if command -v java; then exit 1; fi
            hidane exec -- firebase emulators:exec "npm test" 2>&1 | grep -w pass
          )
      - name: The machine and the versions
        run: |
          {
            echo "runner: $ImageOS $ImageVersion, $(nproc) vCPUs, $(free -g | awk '/^Mem:/ { print $2 }') GiB"
            grep -m1 'model name' /proc/cpuinfo
            java -version 2>&1 | head -1
            echo "node $(node --version), firebase-tools $(firebase --version)"
            hidane --version
            vhs --version
          } > machine.txt
          cat machine.txt
          { echo "## The recording's machine"; echo; echo '```'; cat machine.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Record
        run: |
          for tape in demo demo-startup demo-writes; do
            vhs "$tape.tape"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo
          path: |
            docs/assets/demo/*.gif
            docs/assets/demo/machine.txt
          if-no-files-found: error
