name: nodejs-firestore system tests

# Runs the system tests of the Node.js server SDK (@google-cloud/firestore, google-cloud-node's
# handwritten/firestore, `system-test:emulator:grpc` and `system-test:emulator:rest`) at a pinned
# commit against hidane, over gRPC and over REST, and compares each test's outcome with the run
# against the official emulator kept in results/nodejs-system-tests-official-v1.22.0.json and
# results/nodejs-system-tests-rest-official-v1.22.0.json (tools/nodejs-system-tests/README.md).
# It fails on a test that passes there and not on hidane, unless
# tools/nodejs-system-tests/expected-failures.txt lists it, and on a listed test that passes.
#
# It runs weekly, by hand, and for changes to the server, the runner or the recorded results.
# Run by hand with `official`, it also runs the suite against a freshly started official emulator
# (the pinned release) and uploads those results, to record them at a new commit.
# It runs third-party code (the SDK and its tests): it needs no secret and gets none.

on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:
    inputs:
      official:
        description: Run the suite against the official emulator too, and upload its results
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "tools/nodejs-system-tests/**"
      - "results/nodejs-system-tests-*.json"
      - ".github/workflows/nodejs-system-tests.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "tools/nodejs-system-tests/**"
      - "results/nodejs-system-tests-*.json"
      - ".github/workflows/nodejs-system-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The google-cloud-node commit the suite runs at. results/nodejs-system-tests-*.json were
  # recorded there; compare.mjs refuses a run of another commit.
  GOOGLE_CLOUD_NODE_COMMIT: cf2e273257719b10195f55639b18cc25472775d2 # firestore-v9.4.0

jobs:
  suite:
    name: ${{ matrix.name }} against hidane
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gRPC
            transport: grpc
            results: nodejs-system-tests
          - name: REST
            transport: rest
            results: nodejs-system-tests-rest
    env:
      TRANSPORT: ${{ matrix.transport }}
      RESULTS: ${{ matrix.results }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: googleapis/google-cloud-node
          ref: ${{ env.GOOGLE_CLOUD_NODE_COMMIT }}
          path: google-cloud-node
          sparse-checkout: |
            handwritten/firestore
            bin
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # pnpm as google-cloud-node's package.json pins it (`packageManager`), through Corepack.
      - name: Enable pnpm
        run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build hidane
        run: cargo build --release --locked -p hidane
      - name: Install and compile the Firestore package
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: tools/nodejs-system-tests/setup.sh google-cloud-node
      - name: Start hidane
        run: |
          target/release/hidane --host 127.0.0.1 --port 8080 > "$RUNNER_TEMP/hidane.log" 2>&1 &
          timeout 30 sh -c 'until curl -fsS http://127.0.0.1:8080/ > /dev/null; do sleep 1; done'
      - name: Run the system tests
        run: tools/nodejs-system-tests/run.sh google-cloud-node 8080 "$RUNNER_TEMP/report.json" "$TRANSPORT"
      - name: Compare with the official emulator
        run: |
          node tools/nodejs-system-tests/results.mjs "$GOOGLE_CLOUD_NODE_COMMIT" hidane "$RUNNER_TEMP/report.json" \
            "$TRANSPORT" > "$RUNNER_TEMP/$RESULTS-hidane.json"
          node tools/nodejs-system-tests/compare.mjs "results/$RESULTS-official-v1.22.0.json" \
            "$RUNNER_TEMP/$RESULTS-hidane.json" tools/nodejs-system-tests/expected-failures.txt
      # The run's results (as committed in results/), Mocha's report and hidane's log.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.results }}-hidane
          path: |
            ${{ runner.temp }}/${{ matrix.results }}-hidane.json
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/hidane.log
          if-no-files-found: ignore

  official:
    name: ${{ matrix.name }} against the official emulator
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.official }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gRPC
            transport: grpc
            results: nodejs-system-tests
          - name: REST
            transport: rest
            results: nodejs-system-tests-rest
    env:
      TRANSPORT: ${{ matrix.transport }}
      RESULTS: ${{ matrix.results }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: googleapis/google-cloud-node
          ref: ${{ env.GOOGLE_CLOUD_NODE_COMMIT }}
          path: google-cloud-node
          sparse-checkout: |
            handwritten/firestore
            bin
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install and compile the Firestore package
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: tools/nodejs-system-tests/setup.sh google-cloud-node
      # Started after the setup, so the suite meets a fresh emulator.
      - name: Start the official emulator
        id: official
        uses: ./.github/actions/official-emulator
      - name: Run the system tests
        run: tools/nodejs-system-tests/run.sh google-cloud-node 8080 "$RUNNER_TEMP/report.json" "$TRANSPORT"
      - name: Turn the report into results
        env:
          VERSION: ${{ steps.official.outputs.version }}
        run: |
          node tools/nodejs-system-tests/results.mjs "$GOOGLE_CLOUD_NODE_COMMIT" "official v$VERSION" \
            "$RUNNER_TEMP/report.json" "$TRANSPORT" > "$RUNNER_TEMP/$RESULTS-official-v$VERSION.json"
      # The results to commit in results/, Mocha's report and the emulator's log.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.results }}-official
          path: |
            ${{ runner.temp }}/${{ matrix.results }}-official-v*.json
            ${{ runner.temp }}/report.json
            ${{ steps.official.outputs.log }}
          if-no-files-found: ignore
