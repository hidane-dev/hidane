name: Official emulator

# Checks the recordings of the official Cloud Firestore emulator that hidane's tests replay
# against the emulator itself (tools/oracle/README.md).
#
# - drift: re-records a few recordings that take seconds and come out the same on every run,
#   each against a freshly started official emulator (.github/workflows/official-recordings.yml),
#   and fails when one differs from the committed fixture. Run by hand with another version and
#   its SHA-256, it shows what that emulator answers differently; each recording is uploaded.
#
# - newer: fails when firebase-tools' latest release pins another Firestore emulator than the one
#   the fixtures were recorded from (.github/actions/official-emulator/pinned.sh), and says what
#   to do. The Upstream workflow (tools/upstream/README.md) watches every channel daily and runs
#   its compatibility canary against such a release.
#
# It runs weekly, by hand, and for changes to the action or the workflows.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: Official emulator version to record against (empty for the pinned one)
        required: false
        default: ""
      sha256:
        description: Its jar's SHA-256 (expectedChecksumSHA256), with a version
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/actions/official-emulator/**"
      - ".github/workflows/official-emulator.yml"
      - ".github/workflows/official-recordings.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: drift
    uses: ./.github/workflows/official-recordings.yml
    with:
      version: ${{ inputs.version }}
      sha256: ${{ inputs.sha256 }}

  newer:
    name: newer official emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/official-emulator
      - name: Compare with firebase-tools' latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .github/actions/official-emulator/pinned.sh
          tag=$(gh api repos/firebase/firebase-tools/releases/latest --jq .tag_name)
          info=$(gh api "repos/firebase/firebase-tools/contents/src/emulator/downloadableEmulatorInfo.json?ref=$tag" \
            -H "Accept: application/vnd.github.raw")
          version=$(jq -r .firestore.version <<< "$info")
          sha256=$(jq -r .firestore.expectedChecksumSHA256 <<< "$info")
          url=$(jq -r .firestore.remoteUrl <<< "$info")
          release="[firebase-tools $tag](https://github.com/firebase/firebase-tools/releases/tag/$tag)"
          if [[ "$version" == "$PINNED_VERSION" && "$sha256" == "$PINNED_SHA256" ]]; then
            echo "$release, the latest release, pins cloud-firestore-emulator v$version (SHA-256 \`$sha256\`), the one the fixtures were recorded from." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$version" == "$PINNED_VERSION" ]]; then
            what="v$version with another jar"
          elif [[ "$(printf '%s\n' "$PINNED_VERSION" "$version" | sort -V | tail -n 1)" == "$version" ]]; then
            what="v$version, newer than v$PINNED_VERSION"
          else
            what="v$version, older than v$PINNED_VERSION"
          fi
          {
            echo "## $release pins another Firestore emulator"
            echo
            echo "It pins cloud-firestore-emulator $what. The fixtures were recorded from the one in pinned.sh:"
            echo
            echo "| | Version | SHA-256 |"
            echo "|---|---|---|"
            echo "| firebase-tools $tag | $version | \`$sha256\` |"
            echo "| pinned.sh | $PINNED_VERSION | \`$PINNED_SHA256\` |"
            echo
            echo "Its jar is at $url."
            if [[ "$url" != "https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v$version.jar" ]]; then
              echo "That is not the URL .github/actions/official-emulator derives from the version: change it there first."
            fi
            echo
            echo "1. Run this workflow by hand with version \`$version\` and SHA-256 \`$sha256\`: each drift job records against that jar, fails if its recording differs from the fixture, and uploads it."
            echo "2. To move to it, re-record every fixture against it (tools/oracle/README.md) with the \`oracle\` field the scripts write updated, change hidane where its answers changed, set .github/actions/official-emulator/pinned.sh, and update the version where the docs and results/ name v$PINNED_VERSION."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Another official emulator::firebase-tools $tag pins cloud-firestore-emulator $what; the job summary says what to do"
          exit 1
