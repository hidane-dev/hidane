name: Production parity

# Replays recordings of the official emulator against production Cloud Firestore, in a project
# of the maintainers' own, and reports what production answers differently (#82,
# tools/production/README.md). It signs in through Workload Identity Federation: no key exists,
# and only this workflow on main may use the project. What it finds is a workflow artifact and
# the job summary, not a recording (docs/clean-room/OBSERVATION_POLICY.md).
#
# The rules job then deploys the rules of recordings of rules and sends their requests, a seventh
# of them each night, by the day of the week. While it runs, the project's database is open as
# those rules open it; it takes them down when it ends, whatever happened.
#
# The datastore job replays the recordings in Datastore mode against the project's database of
# that mode, `datastore`, beside the others: it empties only that database.

on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch:
    inputs:
      rules-shard:
        description: "Which seventh of what deploys rules to send, 0 to 6; the day's by default"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: production-parity
  cancel-in-progress: false

jobs:
  firestore:
    name: replay against production Firestore
    if: github.repository == 'hidane-dev/hidane'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-parity
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
      - name: Replay the recordings
        env:
          PRODUCTION_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: >
          python3 -I -B tools/production/replay.py --project "$PROJECT" --out production-parity
          crates/hidane/tests/fixtures/rest.json
          crates/hidane/tests/fixtures/conformance.json
          crates/hidane/tests/fixtures/queries.json
          crates/hidane/tests/fixtures/listen_queries.json
          crates/hidane/tests/fixtures/aggregations.json
          crates/hidane/tests/fixtures/same_document_writes.json
          crates/hidane/tests/fixtures/document_writes.json
          crates/hidane/tests/fixtures/transforms.json
          crates/hidane/tests/fixtures/base_versions.json
          crates/hidane/tests/fixtures/limits.json
          crates/hidane-core/tests/fixtures/value_order.json
          crates/hidane/tests/fixtures/list_documents.json
          crates/hidane/tests/fixtures/read_time_and_databases.json
          crates/hidane/tests/fixtures/field_order.json
          crates/hidane/tests/fixtures/find_nearest.json
          crates/hidane/tests/fixtures/json_escapes.json
          crates/hidane/tests/fixtures/unsupported.json
          crates/hidane-rules/tests/fixtures/rules_eval.json
          crates/hidane/tests/fixtures/rules_compile.json
          crates/hidane-rules/tests/fixtures/rules_warnings.json
          crates/hidane-rules/tests/fixtures/rules_paths.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-parity
          path: production-parity/
          retention-days: 30
          if-no-files-found: ignore

  rules:
    name: replay with rules deployed
    needs: firestore
    # After the replay above, whatever it found: both empty the same database.
    if: ${{ !cancelled() && github.repository == 'hidane-dev/hidane' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production-parity
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
      - name: Replay with the rules deployed
        # Short of the job's timeout, so that the rules are taken down below.
        timeout-minutes: 30
        env:
          PRODUCTION_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          SHARD: ${{ inputs.rules-shard }}
        run: |
          # The day of the week's seventh, Sunday's the first: all of it would outlast the token.
          case "$SHARD" in
            [0-6]) ;;
            "") SHARD=$(( $(date -u +%u) % 7 )) ;;
            *) echo "::error::rules-shard takes 0 to 6"; exit 1 ;;
          esac
          python3 -I -B tools/production/replay.py --project "$PROJECT" --out production-rules \
            --deploy-rules --shard "$SHARD/7" \
            crates/hidane-rules/tests/fixtures/rules_eval.json \
            crates/hidane/tests/fixtures/rules_request.json \
            crates/hidane/tests/fixtures/rules_writes.json \
            crates/hidane/tests/fixtures/rules_verify.json \
            crates/hidane/tests/fixtures/rules_lookups.json \
            crates/hidane/tests/fixtures/rules_same_document.json \
            crates/hidane/tests/fixtures/rules_denials.json
      - name: Take the rules down
        # The replay takes them down as it ends; this does it again in case it was stopped.
        if: always() && steps.auth.outcome == 'success'
        env:
          PRODUCTION_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: python3 -I -B tools/production/release.py --project "$PROJECT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-rules
          path: production-rules/
          retention-days: 30
          if-no-files-found: ignore

  datastore:
    name: replay against a Datastore-mode database
    if: github.repository == 'hidane-dev/hidane'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-parity
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
      - name: Replay the recordings in Datastore mode
        env:
          PRODUCTION_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        # The database has no free quota: the budget bounds what a run is billed.
        run: >
          python3 -I -B tools/production/replay.py --project "$PROJECT" --out production-datastore
          --datastore-database datastore --budget 3000
          crates/hidane/tests/fixtures/datastore_entities.json
          crates/hidane/tests/fixtures/datastore_queries.json
          crates/hidane/tests/fixtures/datastore_gql.json
          crates/hidane/tests/fixtures/datastore_firestore_api.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-datastore
          path: production-datastore/
          retention-days: 30
          if-no-files-found: ignore
