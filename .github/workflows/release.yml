name: Release

# A tag `v<version>` checks the version everywhere it is written, generates the third-party
# notices (cargo-about), builds every target with them embedded and packaged, writes
# sha256sums.txt, attests each archive's build provenance and creates a **draft** GitHub Release
# for a maintainer to publish (docs/releasing.md). The binaries and archives are built so that
# the same commit gives the same bytes (packaging/release/, docs/reproducible-builds.md). A pull
# request that changes this file or packaging/release/ runs the builds only, as a dry run.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - about.toml
      - about.hbs
      - crates/hidane/build.rs
      - "packaging/release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notices:
    name: third-party notices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Versions
        run: |
          # Cargo.toml, its pins, the pub launcher and the tag agree (packaging/check-versions.mjs).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node packaging/check-versions.mjs "$GITHUB_REF_NAME"
          else
            node packaging/check-versions.mjs
          fi
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.2
      - name: Generate
        run: cargo about generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  # One CycloneDX SBOM per target: the crates built into the binary, build dependencies and
  # proc macros included, dev-dependencies left out, with versions, licenses and checksums. Each
  # is published next to its archive and attested to it, and the image is attested with the Linux
  # one (docs/verifying-releases.md). A pull request's dry run generates them and assembles the
  # release assets too.
  sbom:
    name: SBOMs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - name: Generate
        run: |
          mkdir sbom
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin \
            x86_64-apple-darwin x86_64-pc-windows-msvc; do
            cargo cyclonedx --manifest-path crates/hidane/Cargo.toml --describe binaries \
              --target "$target" --target-in-filename --format json --spec-version 1.5
            mv "crates/hidane/hidane_bin_$target.cdx.json" "sbom/$target.cdx.json"
          done
          # Read through `cargo metadata`, which must have left the lock file as it was.
          git diff --exit-code Cargo.lock
      - name: Linux SBOMs agree
        run: |
          # The image holds both Linux binaries and is attested with one SBOM, the x86_64 one.
          crates() {
            python3 -c 'import json, sys; [print(c["purl"]) for c in json.load(open(sys.argv[1]))["components"]]' "$1" | sort
          }
          diff <(crates sbom/x86_64-unknown-linux-musl.cdx.json) <(crates sbom/aarch64-unknown-linux-musl.cdx.json)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}
    needs: notices
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, native: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, native: true }
          - { target: aarch64-apple-darwin, os: macos-15, native: true }
          - { target: x86_64-apple-darwin, os: macos-15, native: false }
          - { target: x86_64-pc-windows-msvc, os: windows-2022, native: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # build.sh installs the Rust it builds with (packaging/release/rust-toolchain.toml) through
      # the runner's rustup; the archives are dated with the commit's time.
      - name: Commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Version
        id: version
        run: |
          # `cargo pkgid` ends with `#<version>` or `#hidane@<version>`.
          crate=$(cargo pkgid -p hidane)
          crate="${crate##*[#@]}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$crate" ]]; then
              echo "::error::tag v$version does not match the crate version $crate"
              exit 1
            fi
          else
            version="$crate-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The pinned toolchain, `--locked`, paths remapped; build.rs embeds the notices for
      # `--licenses`.
      - name: Build
        run: packaging/release/build.sh "$TARGET" THIRD-PARTY-LICENSES.txt
      - name: Smoke test
        if: matrix.native
        run: |
          bin="target/$TARGET/release/hidane"
          "$bin" --version
          "$bin" --licenses > licenses.txt
          grep -q "Third-party software in hidane" licenses.txt
          if [[ "$TARGET" == *linux-musl ]]; then
            file "$bin" | tee /dev/stderr | grep -Eq "statically linked|static-pie linked"
          fi
      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="hidane-$VERSION-$TARGET"
          mkdir "$name"
          ext=""
          [[ "$TARGET" == *windows* ]] && ext=".exe"
          cp "target/$TARGET/release/hidane$ext" LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt README.md "$name/"
          # Sorted entries, fixed owner and modes, dated SOURCE_DATE_EPOCH.
          if [[ "$TARGET" == *windows* ]]; then
            python packaging/release/archive.py "$name" "$name.zip"
            echo "archive=$name.zip" >> "$GITHUB_OUTPUT"
          else
            python3 packaging/release/archive.py "$name" "$name.tar.gz"
            echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  # The release's assets, also on a pull request's dry run: the archives, an SBOM named after each
  # (hidane-<version>-<target>.cdx.json) and sha256sums.txt over all of them.
  assets:
    name: release assets
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          # The archives (named by target), not the notices, which each archive holds.
          pattern: "*-*"
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - name: SBOMs
        run: |
          shopt -s nullglob
          for sbom in sbom/*.cdx.json; do
            target=$(basename "$sbom" .cdx.json)
            archives=(dist/hidane-*-"$target".tar.gz dist/hidane-*-"$target".zip)
            if [[ ${#archives[@]} -ne 1 ]]; then
              echo "::error::expected one archive for $target, found ${#archives[@]}"
              exit 1
            fi
            name="${archives[0]%.tar.gz}"
            cp "$sbom" "${name%.zip}.cdx.json"
          done
          archives=(dist/*.tar.gz dist/*.zip)
          sboms=(dist/*.cdx.json)
          if [[ ${#archives[@]} -ne 5 || ${#sboms[@]} -ne 5 ]]; then
            echo "::error::expected five archives, each with its SBOM: ${archives[*]} ${sboms[*]}"
            exit 1
          fi
      - name: Checksums
        working-directory: dist
        run: sha256sum hidane-* | tee sha256sums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: draft release
    needs: assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # One attestation for every archive and SBOM. `gh attestation verify` finds it by the
      # file's digest; its bundle is also attached, for offline verification and for tools that
      # look for provenance among the assets.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: dist/hidane-*
      - name: Provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: jq -c . "$BUNDLE" > "dist/hidane-${GITHUB_REF_NAME#v}.intoto.jsonl"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "hidane ${GITHUB_REF_NAME#v}" \
            --notes "Draft created by the release workflow. Write the notes, then approve the publish job (docs/releasing.md)."

  # Each archive's SBOM, attested to the archive: `gh attestation verify <archive>
  # --predicate-type https://cyclonedx.org/bom` checks it and returns the SBOM.
  sbom-attestation:
    name: SBOM attestation ${{ matrix.target }}
    needs: release
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target }}
          path: archive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: archive/hidane-*
          sbom-path: sbom/${{ matrix.target }}.cdx.json

  # Everything below waits for a maintainer's approval of the `release` environment, given after
  # the draft's notes are written. Release candidates (`v0.1.0-rc.1`) stop at the draft.
  publish:
    name: publish the release
    needs: [release, sbom-attestation]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  crates:
    name: crates.io
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Trusted publishing: a short-lived token for this workflow, no stored secret.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # Dependencies first; `cargo publish` returns once the crate is in the index. Versions
      # already on crates.io are skipped, so a re-run finishes what a failed run left.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in hidane-proto hidane-core hidane-rules hidane; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H "User-Agent: hidane-release (github.com/hidane-dev/hidane)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [[ "$status" == 200 ]]; then
              echo "$crate $version is already on crates.io"
              continue
            fi
            cargo publish --locked -p "$crate"
          done

  npm:
    name: npm
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm 11.15.0 or newer stages through trusted publishing (stage.sh checks).
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Assemble
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'hidane-*' --dir dist
          node packaging/npm/assemble.mjs "${GITHUB_REF_NAME#v}" dist npm
      # Staged publishing: the versions wait on npmjs.com until a maintainer approves each one
      # with 2FA (the trusted publishers allow `npm stage publish` only).
      - name: Stage
        run: sh packaging/npm/stage.sh "${GITHUB_REF_NAME#v}" npm --provenance
      - name: Summary
        run: |
          {
            echo "### npm: approve the staged versions with 2FA"
            echo "The platform packages first, then \`hidane\`: npmjs.com, each package's staged versions,"
            echo "or \`npm stage list <package>\` and \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"

  pub:
    name: pub.dev
    needs: publish
    permissions:
      id-token: write
    # pub.dev accepts only workflows started by a tag push matching its pattern (`v{{version}}`).
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      working-directory: packaging/pub

  docker:
    name: ghcr.io/hidane-dev/hidane
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # The image's provenance and SBOM attestations, also pushed to the registry next to it.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'hidane-*-unknown-linux-musl.tar.gz' --dir dist
          mkdir -p ctx/amd64 ctx/arm64
          for pair in x86_64:amd64 aarch64:arm64; do
            name="hidane-$version-${pair%%:*}-unknown-linux-musl"
            tar -xzf "dist/$name.tar.gz" -C dist
            mv "dist/$name/hidane" "ctx/${pair##*:}/hidane"
          done
          cp "dist/$name/LICENSE-MIT" "dist/$name/LICENSE-APACHE" "dist/$name/THIRD-PARTY-LICENSES.txt" ctx/
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # FROM scratch with prebuilt binaries: nothing runs during the build, so no emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: ctx
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/hidane-dev/hidane:${{ steps.context.outputs.version }}
            ghcr.io/hidane-dev/hidane:${{ steps.context.outputs.minor }}
            ghcr.io/hidane-dev/hidane:latest
          labels: |
            org.opencontainers.image.source=https://github.com/hidane-dev/hidane
            org.opencontainers.image.description=hidane, a Firestore emulator without Java
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=${{ steps.context.outputs.version }}
      # Attestations of the multi-platform image (its index digest), which
      # `gh attestation verify oci://ghcr.io/hidane-dev/hidane:<version>` checks. Its SBOM is the
      # x86_64 Linux archive's; the `sbom` job checked that both Linux binaries have the same crates.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/hidane-dev/hidane
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Image SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "hidane-${GITHUB_REF_NAME#v}-x86_64-unknown-linux-musl.cdx.json" --output image.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/hidane-dev/hidane
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: image.cdx.json
          push-to-registry: true

  homebrew:
    name: Homebrew tap
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # A fine-grained token with contents: write on hidane-dev/homebrew-tap. Without it, the
      # formula is left in the job summary to commit by hand.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern sha256sums.txt
          node packaging/homebrew/formula.mjs "${GITHUB_REF_NAME#v}" sha256sums.txt > hidane.rb
      - name: Push to hidane-dev/homebrew-tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/hidane-dev/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp hidane.rb tap/Formula/hidane.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/hidane.rb
          git commit -m "hidane ${GITHUB_REF_NAME#v}"
          git push
      - name: Without a token
        if: env.TAP_TOKEN == ''
        run: |
          echo "::notice::HOMEBREW_TAP_TOKEN is not set; commit Formula/hidane.rb to hidane-dev/homebrew-tap from the job summary"
          { echo '```ruby'; cat hidane.rb; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
