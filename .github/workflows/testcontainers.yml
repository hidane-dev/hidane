name: Testcontainers

# Starts hidane's container image through Testcontainers for Java, Node and Go, in place of the
# Cloud SDK image in their gcloud modules' Firestore emulator container and as a generic container,
# and for Python, which has no Firestore module, as a generic container; and runs Firestore
# operations against it (docs/testcontainers.md, testcontainers/).
#
# The image is built from this commit with packaging/docker/Dockerfile, from the same kind of
# context as the release workflow's: a change to hidane or to the image is tested before a release
# publishes it, and the gcloud modules need hidane 0.5.0 or newer. The tests also run against the
# published v0.6.0 image, pinned by digest, which users can pull today.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "packaging/docker/**"
      - "testcontainers/**"
      - ".github/workflows/testcontainers.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "packaging/docker/**"
      - "testcontainers/**"
      - ".github/workflows/testcontainers.yml"
  # Weekly, for changes in Docker and the runners; the test projects pin their dependencies.
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The image built from this commit, loaded into each job's Docker; never pushed.
  SOURCE_IMAGE: hidane:testcontainers
  # ghcr.io/hidane-dev/hidane:0.6.0 (linux/amd64, linux/arm64).
  PUBLISHED_IMAGE: ghcr.io/hidane-dev/hidane@sha256:bb5fd17a8efe01ded3803ccdab7b794152f0dd2ee112f6ccb27201774fc722ba

jobs:
  image:
    name: image from source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust and musl
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
          sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: musl
      - name: Build
        run: cargo build --release --locked -p hidane --target x86_64-unknown-linux-musl
      - name: Image
        run: |
          # The release workflow's context: the static binary per architecture and the license
          # files. The third-party notices are generated for releases only.
          ctx="$RUNNER_TEMP/ctx"
          mkdir -p "$ctx/amd64"
          cp target/x86_64-unknown-linux-musl/release/hidane "$ctx/amd64/hidane"
          cp LICENSE-MIT LICENSE-APACHE "$ctx/"
          echo "The release images carry the third-party notices here." > "$ctx/THIRD-PARTY-LICENSES.txt"
          docker build --platform linux/amd64 -f packaging/docker/Dockerfile -t "$SOURCE_IMAGE" "$ctx"
          docker run --rm "$SOURCE_IMAGE" --version
          docker save "$SOURCE_IMAGE" | gzip > "$RUNNER_TEMP/image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar.gz
          if-no-files-found: error
          retention-days: 3

  java:
    name: Java (testcontainers-gcloud)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: testcontainers/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/image.tar.gz"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: testcontainers/java/pom.xml
      - name: The image from source, through the gcloud module and as a generic container
        env:
          HIDANE_IMAGE: ${{ env.SOURCE_IMAGE }}
        run: mvn -B -ntp test
      - name: The published v0.6.0 image, through the gcloud module and as a generic container
        env:
          HIDANE_IMAGE: ${{ env.PUBLISHED_IMAGE }}
        run: mvn -B -ntp test

  node:
    name: Node (@testcontainers/gcloud)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: testcontainers/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/image.tar.gz"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: testcontainers/node/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The image from source, through the gcloud module and as a generic container
        env:
          HIDANE_IMAGE: ${{ env.SOURCE_IMAGE }}
        run: npm test
      - name: The published v0.6.0 image, through the gcloud module and as a generic container
        env:
          HIDANE_IMAGE: ${{ env.PUBLISHED_IMAGE }}
        run: npm test

  python:
    name: Python (testcontainers, DockerContainer)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: testcontainers/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/image.tar.gz"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: testcontainers/python/requirements.txt
      - run: pip install --require-hashes -r requirements.txt
      - name: The image from source, as a generic container
        env:
          HIDANE_IMAGE: ${{ env.SOURCE_IMAGE }}
        run: pytest -v
      - name: The published v0.6.0 image, as a generic container
        env:
          HIDANE_IMAGE: ${{ env.PUBLISHED_IMAGE }}
        run: pytest -v

  go:
    name: Go (modules/gcloud/firestore)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: testcontainers/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/image.tar.gz"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: testcontainers/go/go.mod
          cache-dependency-path: testcontainers/go/go.sum
      - name: The image from source, through the gcloud module and as a generic container
        env:
          HIDANE_IMAGE: ${{ env.SOURCE_IMAGE }}
          # It serves Datastore mode (#81); the published v0.6.0 image does not.
          HIDANE_DATASTORE: "1"
        run: go test -count=1 -v ./...
      - name: The published v0.6.0 image, through the gcloud module and as a generic container
        env:
          HIDANE_IMAGE: ${{ env.PUBLISHED_IMAGE }}
        run: go test -count=1 -v ./...
