name: test
on:
  pull_request:
jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    env:
      FIRESTORE_EMULATOR_HOST: localhost:8085
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 21
    - run: npm ci
    - run: npm run test:emulator
    - run: npm run e2e
