name: hidane_flutter_web
description: Flutter Web scenarios for comparing Firestore emulators.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 4.15.0
  cloud_firestore: 6.10.0
  # Pinned as well: firebase_core_web decides which firebase-js-sdk is loaded (12.19.0).
  cloud_firestore_web: 5.7.3
  firebase_core_web: 3.12.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
